# Site
title:            "Nilesh Balu"
tagline:          "Robotics, Dynamics & Control"
description:      "MSc Mechanical Engineering student at ETH Zürich working on robotics, dynamics and control, with a focus on rehabilitation and medical robotics."
url:              "https://nileshbalu.github.io"
baseurl:          ""
lang:             en
image:            /images/profile.jpg

author:
  name:           "Nilesh Balu"
  email:          "nileshbalu892@gmail.com"
  linkedin:       "nileshbalu2002"
  github:         "NileshBalu"

social:
  name:           "Nilesh Balu"
  links:
    - https://www.linkedin.com/in/nileshbalu2002
    - https://github.com/NileshBalu

# Build
markdown:         kramdown
highlighter:      rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  projects:
    output:       true
    sort_by:      order
    permalink:    /projects/:path/
  coursework:
    output:       true
    permalink:    /coursework/:path/

defaults:
  - scope:
      type:       projects
    values:
      layout:     project
  - scope:
      type:       coursework
    values:
      layout:     project

exclude:
  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  # Leftovers from the old hand-built site / Hyde theme; safe to delete
  - docs
  - _posts
  - atom.xml
  - CNAME
  - images/profile.png
  - attachments/Final_Presentation.mp4
